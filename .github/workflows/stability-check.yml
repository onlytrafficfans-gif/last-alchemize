name: Stability Check

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    defaults:
      run:
        working-directory: expo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: bun run typecheck

      - name: Backend TypeScript check
        run: bun run backend:typecheck

      - name: Lint
        run: bun run lint

      - name: Expo Doctor
        run: bunx expo-doctor

      - name: Run handoff validation
        run: bun run validate:handoff

      - name: Run repository health check
        run: bun run validate:health

      - name: Run production preflight
        run: bun run validate:production

      - name: Run final validation
        run: bun run validate:final

      - name: Export web bundle
        run: bun run export:web

      - name: Export Android bundle
        run: bun run export:android

      - name: Backend build check
        run: bun run backend:typecheck
