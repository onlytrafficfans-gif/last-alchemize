# Base44 development environment for the Alchemize Expo app.
# Runs the Expo web dev server from the cloned source so edits hot-reload.
services:
  web:
    image: oven/bun:1.3.14
    working_dir: /repo/expo
    restart: on-failure
    env_file:
      - /run/base44/app.env
    environment:
      # Sandbox-only passthrough (not application secrets). The backend API
      # URL is user-supplied and comes from env_file below, never from here.
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - PORT=3000
    volumes:
      # Bind-mount the cloned source so edits are reflected live.
      - ./:/repo
      # Keep installed deps in a named volume so the host checkout never shadows them.
      - expo_node_modules:/repo/expo/node_modules
    ports:
      - "3000:3000"
    command:
      [
        "sh",
        "-ec",
        "bun install --frozen-lockfile && exec bunx expo start --web --port 3000 --host lan",
      ]
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s

volumes:
  expo_node_modules:
