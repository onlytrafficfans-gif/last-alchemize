services:
  web:
    image: oven/bun:1.3.14-debian
    working_dir: /app
    volumes:
      - ./expo:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      # Optional external integrations — the app boots fine without them.
      # Passed through so a real dashboard value always wins over any default.
      - EXPO_PUBLIC_SUPABASE_URL
      - EXPO_PUBLIC_SUPABASE_ANON_KEY
      - EXPO_PUBLIC_RORK_API_BASE_URL
    command:
      - sh
      - -ec
      - |
        bun install --frozen-lockfile
        exec bunx expo start --web --port 3000 --host lan
    healthcheck:
      test: ["CMD-SHELL", "bun -e 'fetch(\"http://127.0.0.1:3000/\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s
    restart: on-failure

volumes:
  node_modules:
