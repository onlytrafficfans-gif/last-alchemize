services:
  web:
    image: oven/bun:1.3
    working_dir: /app
    volumes:
      - ./expo:/app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - EXPO_NO_TELEMETRY=true
      - EXPO_NO_INTERACTION=true
      # Bare var — platform sets it; Metro ignores it, harmless if unset
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      # Used by app.config.js to allow the preview origin in Expo's CORS middleware
      - BASE44_PUBLIC_HOST_SUFFIX
    command:
      [
        "sh",
        "-ec",
        "bun install --frozen-lockfile && exec bunx expo start --web --port 3000 --host lan",
      ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bun -e \"fetch('http://localhost:3000').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s
    restart: on-failure
